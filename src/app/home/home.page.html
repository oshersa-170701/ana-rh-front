<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Dashboard ANA Medic 💫</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <div class="action-container" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
    <h2>Gestión de Personal</h2>
    
    <ion-button expand="block" (click)="abrirModalEmpleado()">
      <ion-icon slot="start" name="person-add-outline"></ion-icon>
      Registrar Nuevo Empleado
    </ion-button>

    <ion-button expand="block" color="secondary" (click)="abrirModalUsuario()">
      <ion-icon slot="start" name="shield-checkmark-outline"></ion-icon>
      Registrar Nuevo Usuario (Admin)
    </ion-button>
  </div>

  <ion-modal [isOpen]="isUsuarioModalOpen" (didDismiss)="cerrarModalUsuario()">
    <ng-template>
      </ng-template>
  </ion-modal>

</ion-content>
