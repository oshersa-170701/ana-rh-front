<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Nueva Sucursal</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancelar()">Cancelar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding modal-dark-content">
  <form (ngSubmit)="guardar()">
    
    <div class="form-group">
      <ion-item lines="none" class="custom-select-item">
        <ion-select 
          label="Seleccionar Empresa" 
          labelPlacement="floating" 
          interface="popover"
          name="tenant_id"
          [(ngModel)]="nuevaSucursal.tenant_id"
          placeholder="Elegir empresa dueña"
          required>
          <ion-select-option *ngFor="let empresa of empresasActivas" [value]="empresa.id">
            {{ empresa.nombre }}
          </ion-select-option>
        </ion-select>
      </ion-item>
      <ion-note slot="helper" *ngIf="empresasActivas.length > 0">Solo aparecen empresas con estatus Activo.</ion-note>
      <ion-note slot="error" color="danger" *ngIf="empresasActivas.length === 0">No hay empresas activas disponibles.</ion-note>
    </div>

    <div class="form-group ion-margin-top">
      <ion-input 
        label="Nombre de la Sucursal" 
        labelPlacement="floating" 
        fill="solid" 
        type="text" 
        name="nombre"
        [(ngModel)]="nuevaSucursal.nombre" 
        required
        placeholder="Ej. Sucursal Centro">
      </ion-input>
    </div>

    <div class="form-group ion-margin-top">
      <ion-textarea 
        label="Dirección (Opcional)" 
        labelPlacement="floating" 
        fill="solid" 
        name="direccion"
        [(ngModel)]="nuevaSucursal.direccion" 
        [autoGrow]="true"
        placeholder="Calle, Número, Colonia...">
      </ion-textarea>
    </div>

    <div class="form-actions ion-margin-top">
      <ion-button type="submit" expand="block" color="success">
        <ion-icon slot="start" name="save-outline"></ion-icon>
        Guardar Sucursal
      </ion-button>
    </div>
  </form>
</ion-content>
