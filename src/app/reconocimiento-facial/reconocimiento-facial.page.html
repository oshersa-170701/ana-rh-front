<ion-content class="kiosco-bg">
  <div class="main-layout">
    <div class="header-branding">
      <h1>Reconocimiento Facial</h1>
      <p>Sistema de Acceso Biométrico</p>
    </div>

    <div class="camera-container">
      <video #videoElement autoplay muted playsinline (play)="onVideoPlay()"></video>
      <canvas #canvasElement></canvas>
      <div class="scanner-line"></div>
    </div>

    @if (empleadoIdentificado) {
      <div class="info-panel animated-fade-in">
        <div class="status-badge">¡Rostro Reconocido!</div>
        <h2>{{ empleadoIdentificado.nombre }}</h2>
        
        <div class="puesto-badge-container">
          <span class="puesto-badge">{{ empleadoIdentificado.puesto }}</span>
        </div>

        <div class="asistencia-actions">
          <p class="instruccion-text">Selecciona la acción a registrar:</p>
          
          <div class="botones-grid">
            <button class="btn-asistencia entrada" (click)="registrarEvento('ENTRADA')">
              🚪 Entrada
            </button>
            <button class="btn-asistencia inicio-comida" (click)="registrarEvento('INICIO_ALMUERZO')">
              🍔 Iniciar Almuerzo
            </button>
            <button class="btn-asistencia fin-comida" (click)="registrarEvento('FIN_ALMUERZO')">
              ☕ Regreso Almuerzo
            </button>
            <button class="btn-asistencia salida" (click)="registrarEvento('SALIDA')">
              🏠 Salida
            </button>
          </div>
        </div>

      </div>
    }
  </div>
</ion-content>
